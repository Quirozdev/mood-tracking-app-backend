services:
  db:
    image: postgres:18
    restart: always
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_development_data:/var/lib/postgresql
    ports:
      - '5432:5432'

  migration:
    build:
      context: .
      dockerfile: Dockerfile.development
    command: npm run migration:run
    env_file:
      - .env.development
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.development
    env_file:
      - .env.development
    ports:
      - '3000:3000'
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./public:/app/public

volumes:
  postgres_development_data:
